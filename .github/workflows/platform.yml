name: platform

on:
  push:
    paths:
      - contracts/**
      - mock-server/**
      - frontend/**
      - app/web/client/**
      - app/web/static/app.js
      - biome.json
      - .github/workflows/platform.yml
  pull_request:
    paths:
      - contracts/**
      - mock-server/**
      - frontend/**
      - app/web/client/**
      - app/web/static/app.js
      - biome.json
      - .github/workflows/platform.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Vitest's jsdom environment runs on Node (see frontend/README.md); everything else runs on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --cwd mock-server --frozen-lockfile
      - run: bun install --cwd contracts/codegen --frozen-lockfile
      - run: bun install --cwd frontend --frozen-lockfile
      - name: Contract generator and mock types and lint
        run: |
          bun run --cwd contracts/codegen typecheck
          bun run --cwd contracts/codegen lint
          bun run --cwd mock-server typecheck
          bun run --cwd mock-server lint
      - name: Mock tests and contract drift
        run: bun run --cwd mock-server test
      - name: Codegen check, types, lint, unit tests, build, bundle check
        run: bun run --cwd frontend verify
      - name: Browser acceptance tests against the mock
        working-directory: frontend
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/

  mvp-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd app/web/client --frozen-lockfile
      - name: Python MVP browser client types, lint and bundle drift
        run: |
          bun run --cwd app/web/client typecheck
          bun run --cwd app/web/client lint
          bun run --cwd app/web/client check
