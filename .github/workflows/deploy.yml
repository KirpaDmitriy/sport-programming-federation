name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One running deployment; newer pending runs may supersede older pending runs.
# release.sh also locks the host so manual deployments use the same serialization.
concurrency:
  group: stand-deploy
  cancel-in-progress: false

# contents:read is required for actions/checkout on the private repository.
permissions:
  contents: read

jobs:
  # The stand only ships code that passes the platform and backend gates.
  # docker.yml still runs on every push but does not gate: the stand deploys a
  # host-built release, not the container image.
  platform:
    if: github.repository == 'KirpaDmitriy/sport-programming-federation'
    uses: ./.github/workflows/platform.yml
  backend:
    if: github.repository == 'KirpaDmitriy/sport-programming-federation'
    uses: ./.github/workflows/backend.yml
  infra:
    if: github.repository == 'KirpaDmitriy/sport-programming-federation'
    uses: ./.github/workflows/infra.yml

  stand:
    # The demo stand is deployed only from the shared repository; the fork mirrors it.
    if: github.repository == 'KirpaDmitriy/sport-programming-federation'
    needs: [platform, backend, infra]
    environment:
      name: stand
      url: ${{ vars.FSP_PUBLIC_URL || 'https://188.166.88.183' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the deploy SSH identity
        env:
          FSP_DEPLOY_KEY: ${{ secrets.FSP_DEPLOY_KEY }}
          FSP_DEPLOY_KNOWN_HOSTS: ${{ secrets.FSP_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/stdin "$HOME/.ssh/fsp_deploy_ed25519" <<< "$FSP_DEPLOY_KEY"
          install -m 644 /dev/stdin "$HOME/.ssh/known_hosts" <<< "$FSP_DEPLOY_KNOWN_HOSTS"
      - name: Deploy main to the stand
        env:
          FSP_DEPLOY_HOST: stand
          FSP_SSH_CONFIG: ci-ssh-config
        run: |
          cat > ci-ssh-config <<'EOF'
          Host stand
            HostName 188.166.88.183
            User root
            IdentityFile ~/.ssh/fsp_deploy_ed25519
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          infra/deploy.sh "$GITHUB_SHA"
      - name: Public smoke check
        env:
          FSP_PUBLIC_URL: ${{ vars.FSP_PUBLIC_URL || 'https://188.166.88.183' }}
        run: |
          set -euo pipefail
          base="$FSP_PUBLIC_URL"
          curl -fsS -o /dev/null "$base/"
          meta="$(curl -fsS "$base/api/v1/meta")"
          session_status="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/v1/session")"
          [ "$session_status" = 401 ] || { echo 'Anonymous session unexpectedly accepted'; exit 1; }
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/__mock__/session")"
          [ "$code" = 404 ] || { echo "__mock__ answered $code publicly"; exit 1; }
          {
            echo "### Post-deploy smoke"
            echo "- HTTPS frontend: ok"
            echo "- /api/v1/meta served, realLlm=$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["capabilities"]["realLlm"])')"
            echo "- Anonymous session rejected; authenticated journey follows in browser acceptance"
            echo "- /__mock__ stays closed publicly (HTTP $code)"
          } >> "$GITHUB_STEP_SUMMARY"

  public-e2e:
    # Full browser acceptance suite against the freshly deployed stand.
    if: github.repository == 'KirpaDmitriy/sport-programming-federation'
    needs: stand
    environment:
      name: stand
      url: ${{ vars.FSP_PUBLIC_URL || 'https://188.166.88.183' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd frontend --frozen-lockfile
      - name: Browser acceptance tests against the deployed stand
        working-directory: frontend
        env:
          FSP_PUBLIC_URL: ${{ vars.FSP_PUBLIC_URL || 'https://188.166.88.183' }}
          FSP_AUTH_MODE: ${{ vars.FSP_AUTH_MODE || 'demo' }}
          FSP_RESEND_ACCEPTANCE_KEY: ${{ secrets.FSP_RESEND_ACCEPTANCE_KEY }}
          FSP_TEST_EMAIL_DOMAIN: auth.nddev.link
          FSP_DEMO_CODE: "123456"
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e:public
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-public-results
          path: frontend/test-results/
