name: backend

on:
  push:
  pull_request:
  # Called by deploy.yml as the Rust gate before a stand release.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FSP_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in backend/rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install isolated PDF extraction runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap poppler-utils
          if [ -d /sys/kernel/security/apparmor ]; then
            sudo apparmor_parser -r ../infra/apparmor/fsp-pdf-bwrap
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify real PDF extraction under API systemd restrictions
        run: |
          cargo build --locked -p fsp-server
          sudo useradd --system --no-create-home fsp
          sudo install -m 755 target/debug/fsp-career-api /usr/local/bin/fsp-pdf-runtime-check
          sudo bash ../infra/tests/pdf-runtime.sh /usr/local/bin/fsp-pdf-runtime-check
