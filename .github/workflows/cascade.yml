name: cascade

# Merge flow: feature branch -> personal (danil, dima) -> dev -> main.
# Personal branches, dev and main are permanent; merged feature branches are
# deleted. Uses CASCADE_PAT because merges made with GITHUB_TOKEN do not
# trigger the follow-up push workflows (deploy.yml on main).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cascade:
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'KirpaDmitriy/sport-programming-federation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: cascade-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Cascade the merge up the chain
        env:
          GH_TOKEN: ${{ secrets.CASCADE_PAT }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/cascade.sh
