[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vygotsky-talent"
version = "0.1.0"
description = "Verified skills graph and reverse recruiting MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "reportlab>=5.0.1,<6",
]

[project.optional-dependencies]
test = ["httpx2>=2.13,<3", "pytest>=9.1,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
