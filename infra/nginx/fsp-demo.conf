# Installed by infra/provision.sh; __PUBLIC_IP__ is substituted.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://__PUBLIC_IP__$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/fsp-demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsp-demo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fsp:10m;
    ssl_session_timeout 1d;

    root /opt/fsp/current/frontend/dist;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;

    # Mock controls never leave the host, even if the API process allowed them.
    location ^~ /__mock__ {
        return 404;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        # The API accepts only loopback Host headers; the browser origin is checked separately.
        proxy_set_header Host 127.0.0.1:4010;
        # Both the mock (fsp_mock_session) and the Rust backend (fsp_session) session cookies.
        proxy_cookie_flags ~^fsp_(mock_)?session$ secure;
        # LLM-backed endpoints may take up to 45 s upstream.
        proxy_read_timeout 60s;
        include snippets/fsp-security-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/fsp-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/fsp-security-headers.conf;
    }
}
