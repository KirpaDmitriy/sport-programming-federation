# nginx for docker-compose.yml: plain HTTP on 8080, otherwise the same routing as the stand (infra/nginx/fsp-demo.conf).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    # Mock controls never leave the container, even if the API process allowed them.
    location ^~ /__mock__ {
        return 404;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        # The mock accepts only loopback Host headers; the browser origin is checked separately.
        proxy_set_header Host 127.0.0.1:4010;
        proxy_read_timeout 30s;
        include /etc/nginx/fsp-security-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/fsp-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/fsp-security-headers.conf;
    }
}
