version: 2

# Files that only carry local-development placeholder credentials for the
# compose/test PostgreSQL service (the documented default password "fsp" only
# reaches a loopback-bound container database). Real secrets never live in
# these paths. This config file itself is ignored because match values below
# would otherwise be scanned as literals.
paths-ignore:
  - .gitguardian.yaml
  - .env.example
  - docker-compose.yml
  - .github/workflows/backend.yml
  - README.md
  - backend/README.md
  - infra/README.md
  # Bare-metal dev defaults for the loopback compose database (same documented
  # "fsp" placeholder): the api's DATABASE_URL fallback and the test admin URL.
  - backend/crates/server/src/main.rs
  - backend/crates/server/tests/contract.rs
  - backend/crates/storage-postgres/tests/repository.rs
