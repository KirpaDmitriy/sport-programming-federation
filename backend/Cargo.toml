[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
fsp-domain = { path = "crates/domain" }
fsp-application = { path = "crates/application" }
fsp-http = { path = "crates/http" }
fsp-storage-sqlite = { path = "crates/storage-sqlite" }
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
http-body-util = "0.1.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
